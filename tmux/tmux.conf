# Use C-a as prefix
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

# Enable vi key bindings
set-window-option -g mode-keys vi
set-option -g status-keys vi
# bind-key -t vi-copy 'v' begin-selection
# bind-key -t vi-copy 'y' copy-selection

# Set window title to session name
set-option -g set-titles on
set-option -g set-titles-string '#{session_name}'

# Start new pane in current path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Unbind C-x C-O (too similar to C-x o)
unbind C-o

# Kill the active window
bind-key k kill-window

# Renumber windows automatically so closing one doesn't leave a gap
set -g renumber-windows on

# Reserve 20 characters for the session name
set -g status-left-length 20

# Allow for easy reloading of config
bind r source-file ~/.tmux.conf

set -g command-alias[10] reset='rename-window "#{b:pane_current_path}"'
bind-key ' ' reset

set -g status-style "bg=colour240,fg=white"
set -g window-status-style "fg=black"
set -g window-status-current-style "fg=colour39,bg=default,bold,underscore"

set -g pane-border-status top
set -g pane-border-format "#{?pane_active,▶, } #P #{b:pane_current_path}"


# Inactive pane border
set -g pane-border-style "fg=colour240"

# Active pane border
set -g pane-active-border-style "fg=colour39"


set -s escape-time 0             # No delay after Esc
